<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva | Don Brasa </title>
    <link rel="stylesheet" href="estilos_reserva.css">
    <header>
        <h1>Reserva tu mesa en Don Brasa</h1>
    </header>
    <main>
        
        <form action="/reservacion" method="POST">
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>

            <label for="telefono">Número de Teléfono:</label>
            <input type="number" id="telefono" name="telefono" required>

            <label for="fecha">Fecha de Reservación:</label>
            <input type="date" id="fecha" name="fecha" required>

            <label for="hora">Hora de Reservación:</label>
            <input type="time" id="hora" name="hora" required>

            <label for="invitados">Número de Invitados:</label>
            <input type="number" id="invitados" name="invitados" min="1" required>

            <button type="submit">Reservar</button>
        </form>
    
    </main>

    <footer>
    

        <p>&copy; 2026 Restaurante Don Brasa. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
